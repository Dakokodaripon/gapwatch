[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gapwatch"
version = "0.1.0"
description = "Crash-test how database changes reach your app: find the changes it silently misses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "David Akokodaripon" }]
keywords = ["postgres", "realtime", "cdc", "listen-notify", "fault-injection", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gapwatch = "gapwatch.cli:main"

[project.urls]
Repository = "https://github.com/Dakokodaripon/gapwatch"
Issues = "https://github.com/Dakokodaripon/gapwatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gapwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gapwatch"]
